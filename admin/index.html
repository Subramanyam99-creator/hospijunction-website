<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — HospiJunction</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0F2E5C" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{--blue-900:#0F2E5C;--blue-700:#1A56B5;--blue-50:#EFF6FF;--cream:#FAF6EE;--white:#FFFFFF;--ink:#1A1A2E;--muted:#7A7A8A;--border:#E5E7EB;--green:#16A34A;--red:#DC2626;--orange:#EA580C;--radius:8px;--display:'Fraunces',serif;--body:'DM Sans',sans-serif}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--body);background:#F5F6FA;color:var(--ink);font-size:14px}

    .admin-header{background:var(--blue-900);color:var(--white);padding:20px 32px;display:flex;align-items:center;justify-content:space-between}
    .admin-header h1{font-family:var(--display);font-weight:600;font-size:20px;display:flex;align-items:center;gap:12px}
    .admin-header .logo-mark{display:inline-block;background:var(--white);color:var(--blue-900);font-family:var(--display);font-weight:800;padding:5px 9px;border-radius:6px;font-size:14px}
    .admin-header .logout-btn{background:rgba(255,255,255,.12);border:none;color:var(--white);padding:8px 16px;border-radius:8px;cursor:pointer;font-family:var(--body);font-size:13px}
    .admin-header .logout-btn:hover{background:rgba(255,255,255,.2)}

    .container{max-width:1200px;margin:0 auto;padding:28px 24px}

    .login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center}
    .login-card{background:var(--white);border-radius:12px;padding:40px;max-width:380px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.06)}
    .login-card h2{font-family:var(--display);font-weight:600;font-size:22px;margin-bottom:20px;text-align:center}
    .login-card label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
    .login-card input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--body);margin-bottom:16px;box-sizing:border-box}
    .login-card input:focus{outline:none;border-color:var(--blue-700)}
    .login-card button{width:100%;padding:12px;background:var(--blue-700);color:var(--white);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--body)}
    .login-card button:hover{background:var(--blue-900)}
    .login-card .error{color:var(--red);font-size:13px;margin-bottom:12px;display:none}

    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
    .stat-card{background:var(--white);border-radius:12px;padding:20px;border:1px solid var(--border)}
    .stat-card .stat-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .stat-card .stat-value{font-family:var(--display);font-weight:700;font-size:28px;margin-top:6px}

    .card{background:var(--white);border-radius:12px;border:1px solid var(--border);margin-bottom:20px}
    .card-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .card-header h2{font-family:var(--display);font-weight:600;font-size:17px}
    .card-body{padding:0}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th{background:#F9FAFB;padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap}
    td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}
    tr:hover td{background:#FAFBFC}
    .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
    .badge-green{background:#F0FDF4;color:var(--green)}
    .badge-orange{background:#FFF7ED;color:var(--orange)}
    .btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:var(--body);transition:all .15s}
    .btn-red{background:#FEF2F2;color:var(--red);border:1px solid #FECACA}
    .btn-red:hover{background:var(--red);color:var(--white)}
    .btn-green{background:#F0FDF4;color:var(--green);border:1px solid #BBF7D0}
    .btn-green:hover{background:var(--green);color:var(--white)}

    .search-bar{padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:var(--body);min-width:220px}
    .search-bar:focus{outline:none;border-color:var(--blue-700)}

    .toast{position:fixed;bottom:24px;right:24px;padding:14px 22px;border-radius:10px;color:var(--white);font-size:13px;font-weight:500;transform:translateY(100px);opacity:0;transition:all .3s;z-index:999}
    .toast.show{transform:translateY(0);opacity:1}
    .toast-success{background:var(--green)}
    .toast-error{background:var(--red)}
    .toast-info{background:var(--blue-700)}

    .empty{text-align:center;padding:40px;color:var(--muted)}
    .spin{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--blue-700);border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:768px){
      .admin-header{padding:16px 20px}
      .container{padding:20px 16px}
      .card-header{flex-direction:column;align-items:flex-start}
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="admin-header">
      <h1><span class="logo-mark">HJ</span> Admin Panel</h1>
    </div>
    <div class="login-wrap">
      <div class="login-card">
        <h2>Admin Login</h2>
        <div class="error" id="login-error"></div>
        <label>Email</label>
        <input type="email" id="admin-email" placeholder="admin@hospijunction.com" />
        <label>Password</label>
        <input type="password" id="admin-password" placeholder="Password" />
        <button onclick="adminLogin()">Log in</button>
      </div>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="admin-dashboard" style="display:none">
    <div class="admin-header">
      <h1><span class="logo-mark">HJ</span> Admin Panel</h1>
      <button class="logout-btn" onclick="adminLogout()">Logout</button>
    </div>

    <div class="container">
      <div class="stats-row">
        <div class="stat-card"><div class="stat-label">Total Hospitals</div><div class="stat-value" id="stat-total">-</div></div>
        <div class="stat-card"><div class="stat-label">Verified</div><div class="stat-value" id="stat-verified" style="color:var(--green)">-</div></div>
        <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" id="stat-pending" style="color:var(--orange)">-</div></div>
        <div class="stat-card"><div class="stat-label">Total Patients</div><div class="stat-value" id="stat-patients">-</div></div>
        <div class="stat-card"><div class="stat-label">Total Appointments</div><div class="stat-value" id="stat-appointments">-</div></div>
      </div>

      <!-- Hospitals -->
      <div class="card">
        <div class="card-header">
          <h2>All Hospitals</h2>
          <input type="text" class="search-bar" id="search-input" placeholder="Search by name, email, city..." oninput="filterHospitals()" />
        </div>
        <div class="card-body"><div class="table-wrap">
          <table>
            <thead><tr><th>Hospital</th><th>Email</th><th>City</th><th>Phone</th><th>Status</th><th>Registered</th><th>Actions</th></tr></thead>
            <tbody id="hospitals-table"><tr><td colspan="7" class="empty"><div class="spin"></div></td></tr></tbody>
          </table>
        </div></div>
      </div>

      <!-- Patients -->
      <div class="card">
        <div class="card-header">
          <h2>All Patients</h2>
          <input type="text" class="search-bar" id="patient-search" placeholder="Search patients..." oninput="filterPatients()" />
        </div>
        <div class="card-body"><div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>City</th><th>Gender</th><th>Registered</th><th>Actions</th></tr></thead>
            <tbody id="patients-table"><tr><td colspan="7" class="empty"><div class="spin"></div></td></tr></tbody>
          </table>
        </div></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = "https://xamjhwkclcftbyjpzvnq.supabase.co";
    const SUPABASE_ANON = "sb_publishable_Gq_qXLbuG3hwyFxi-_Ou3g_5HFGBVEM";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    const ADMIN_EMAIL = "admin@hospijunction.com";

    let allHospitals = [];
    let allPatients = [];
    let adminKey = '';

    // Auto-login check
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user.email === ADMIN_EMAIL) {
        adminKey = sessionStorage.getItem('hj_admin_key') || '';
        showDashboard();
      }
    })();

    async function adminLogin() {
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errEl = document.getElementById('login-error');

      if (email !== ADMIN_EMAIL) {
        errEl.textContent = 'Access denied. Admin only.';
        errEl.style.display = 'block';
        return;
      }

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        errEl.textContent = 'Invalid credentials: ' + error.message;
        errEl.style.display = 'block';
        return;
      }

      adminKey = prompt('Enter admin delete key (for delete operations):') || '';
      sessionStorage.setItem('hj_admin_key', adminKey);
      showDashboard();
    }

    function showDashboard() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-dashboard').style.display = 'block';
      loadAdminData();
    }

    async function adminLogout() {
      await sb.auth.signOut();
      adminKey = '';
      sessionStorage.removeItem('hj_admin_key');
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('admin-dashboard').style.display = 'none';
    }

    async function loadAdminData() {
      const { data: hospitals } = await sb.from('hospital_profiles')
        .select('id, name, email, phone, city, state, is_verified, is_active, created_at, firebase_uid')
        .order('created_at', { ascending: false });
      allHospitals = hospitals || [];

      const { data: patients } = await sb.from('patient_profiles')
        .select('id, full_name, email, phone, preferred_city, gender, created_at')
        .order('created_at', { ascending: false });
      allPatients = patients || [];

      const { count: apptCount } = await sb.from('appointments')
        .select('id', { count: 'exact', head: true });

      document.getElementById('stat-total').textContent = allHospitals.length;
      document.getElementById('stat-verified').textContent = allHospitals.filter(h => h.is_verified).length;
      document.getElementById('stat-pending').textContent = allHospitals.filter(h => !h.is_verified).length;
      document.getElementById('stat-patients').textContent = allPatients.length;
      document.getElementById('stat-appointments').textContent = apptCount || 0;

      renderHospitals(allHospitals);
      renderPatients(allPatients);
    }

    function renderHospitals(list) {
      const tbody = document.getElementById('hospitals-table');
      if (!list.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty">No hospitals found</td></tr>'; return; }
      tbody.innerHTML = list.map(h => `<tr>
        <td><strong>${esc(h.name || '-')}</strong></td>
        <td>${esc(h.email || '-')}</td>
        <td>${esc(h.city || '-')}, ${esc(h.state || '')}</td>
        <td>${esc(h.phone || '-')}</td>
        <td>${h.is_verified ? '<span class="badge badge-green">Verified</span>' : '<span class="badge badge-orange">Pending</span>'}</td>
        <td>${h.created_at ? new Date(h.created_at).toLocaleDateString('en-IN') : '-'}</td>
        <td>
          ${!h.is_verified ? `<button class="btn btn-green" onclick="verifyHospital('${h.id}')">Verify</button> ` : ''}
          <button class="btn btn-red" onclick="deleteHospital('${h.id}','${esc(h.email||'')}','${esc(h.name||'')}')">Delete</button>
        </td>
      </tr>`).join('');
    }

    function renderPatients(list) {
      const tbody = document.getElementById('patients-table');
      if (!list.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty">No patients found</td></tr>'; return; }
      tbody.innerHTML = list.map(p => `<tr>
        <td><strong>${esc(p.full_name || '-')}</strong></td>
        <td>${esc(p.email || '-')}</td>
        <td>${esc(p.phone || '-')}</td>
        <td>${esc(p.preferred_city || '-')}</td>
        <td>${esc(p.gender || '-')}</td>
        <td>${p.created_at ? new Date(p.created_at).toLocaleDateString('en-IN') : '-'}</td>
        <td><button class="btn btn-red" onclick="deletePatient('${p.id}','${esc(p.full_name||'')}')">Delete</button></td>
      </tr>`).join('');
    }

    function filterHospitals() {
      const q = document.getElementById('search-input').value.toLowerCase();
      renderHospitals(allHospitals.filter(h =>
        (h.name||'').toLowerCase().includes(q) || (h.email||'').toLowerCase().includes(q) ||
        (h.city||'').toLowerCase().includes(q) || (h.phone||'').includes(q)));
    }

    function filterPatients() {
      const q = document.getElementById('patient-search').value.toLowerCase();
      renderPatients(allPatients.filter(p =>
        (p.full_name||'').toLowerCase().includes(q) || (p.email||'').toLowerCase().includes(q) ||
        (p.phone||'').includes(q) || (p.preferred_city||'').toLowerCase().includes(q)));
    }

    async function verifyHospital(id) {
      if (!confirm('Mark this hospital as verified?')) return;
      const { error } = await sb.from('hospital_profiles').update({ is_verified: true }).eq('id', id);
      if (error) { showToast('Failed: ' + error.message, 'error'); }
      else { showToast('Hospital verified!', 'success'); loadAdminData(); }
    }

    async function deleteHospital(id, email, name) {
      if (!confirm(`Delete hospital "${name}" (${email})?\n\nThis removes from database, Supabase Auth, and Firebase Auth. Cannot be undone.`)) return;
      if (prompt('Type DELETE to confirm:') !== 'DELETE') return;

      if (!adminKey) {
        adminKey = prompt('Enter admin delete key:') || '';
        sessionStorage.setItem('hj_admin_key', adminKey);
      }

      showToast('Deleting hospital...', 'info');
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/delete-hospital`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hospital_id: id, email, admin_key: adminKey })
        });
        const result = await res.json();
        if (res.ok && result.success) {
          showToast('Hospital deleted from all systems', 'success');
          loadAdminData();
        } else {
          showToast('Failed: ' + (result.error || JSON.stringify(result)), 'error');
        }
      } catch (err) { showToast('Failed: ' + err.message, 'error'); }
    }

    async function deletePatient(id, name) {
      if (!confirm(`Delete patient "${name}"? Cannot be undone.`)) return;
      if (prompt('Type DELETE to confirm:') !== 'DELETE') return;

      const { error } = await sb.from('patient_profiles').delete().eq('id', id);
      if (error) { showToast('Failed: ' + error.message, 'error'); }
      else { showToast('Patient deleted', 'success'); loadAdminData(); }
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast toast-' + type + ' show';
      setTimeout(() => t.classList.remove('show'), 3500);
    }
  </script>
</body>
</html>
